name: Claude Code

# Responds when someone writes @claude in an issue or PR comment. Auth is a
# Claude subscription OAuth token (CLAUDE_CODE_OAUTH_TOKEN), not an API key —
# generated locally via `claude setup-token` and stored as a repo secret.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
