name: Claude Code

# Responds when someone writes @claude in an issue or PR comment. Auth is a
# Claude subscription OAuth token (CLAUDE_CODE_OAUTH_TOKEN), not an API key —
# generated locally via `claude setup-token` and stored as a repo secret.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Determine model from trigger text
        id: model
        env:
          TRIGGER_TEXT: ${{ github.event.comment.body }}
        run: |
          text=$(printf '%s' "$TRIGGER_TEXT" | tr '[:upper:]' '[:lower:]')
          if echo "$text" | grep -qw "haiku"; then
            echo "model=claude-haiku-4-5-20251001" >> "$GITHUB_OUTPUT"
          elif echo "$text" | grep -qw "opus"; then
            echo "model=claude-opus-5" >> "$GITHUB_OUTPUT"
          else
            echo "model=claude-sonnet-5" >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Mention "haiku" or "opus" in the triggering comment to override
          # the claude-sonnet-5 default set above.
          claude_args: |
            --model ${{ steps.model.outputs.model }}
